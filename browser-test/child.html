<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PostMessageManager stream browser test child</title>
    <script src="/dist/post-message-manager.js"></script>
  </head>
  <body>
    <script>
      const parentOrigin = "http://127.0.0.1:4173";
      const manager = new PostMessageManager.default(500);
      const uncaught = [];
      window.addEventListener("error", (event) => uncaught.push(event.message));
      window.addEventListener("unhandledrejection", (event) => {
        uncaught.push(String(event.reason));
      });
      const request = {
        payload: null,
        target: window.parent,
        targetOrigin: parentOrigin,
      };

      async function collect(messageType) {
        const chunks = [];
        for await (const chunk of manager.stream({ ...request, messageType })) {
          chunks.push(chunk);
        }
        return chunks;
      }

      async function run() {
        const normal = await collect("browser:normal");
        let error;
        try {
          await collect("browser:error");
        } catch (reason) {
          error = { name: reason.name, message: reason.message };
        }

        for await (const chunk of manager.stream({
          ...request,
          messageType: "browser:cancel",
        })) {
          if (chunk === "first") {
            break;
          }
        }

        let openingTimeout = false;
        try {
          await manager.stream({
            ...request, messageType: "browser:late", timeoutMs: 10,
          }).next();
        } catch (reason) {
          openingTimeout = reason.message.includes("Timeout");
        }
        let cloneError;
        try {
          await collect("browser:clone-error");
        } catch (reason) {
          cloneError = { name: reason.name, message: reason.message };
        }
        let queuedCloseRuns = 0;
        for (let i = 0; i < 10; i++) {
          for await (const chunk of manager.stream({
            ...request, messageType: "browser:queued-close",
          })) {
            if (chunk !== "first") { throw new Error("Unexpected first chunk"); }
            break;
          }
          queuedCloseRuns++;
        }
        await new Promise((resolve) => setTimeout(resolve, 30));
        return { normal, error, openingTimeout, cloneError, queuedCloseRuns, uncaught };
      }

      run()
        .then((result) => {
          window.parent.postMessage(
            { type: "browser-test-result", result },
            parentOrigin
          );
        })
        .catch((reason) => {
          window.parent.postMessage(
            {
              type: "browser-test-result",
              result: {
                fatal: { name: reason.name, message: reason.message },
              },
            },
            parentOrigin
          );
        });
    </script>
  </body>
</html>
