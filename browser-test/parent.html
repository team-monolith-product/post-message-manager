<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PostMessageManager stream browser test</title>
    <script>
      const mode = new URLSearchParams(location.search).get("mode") ?? "auto";
      const nativeSupported = (() => {
        const channel = new MessageChannel();
        try {
          const stream = new ReadableStream({
            start(c) {
              c.close();
            },
          });
          channel.port1.postMessage(stream, [stream]);
          return true;
        } catch {
          return false;
        } finally {
          channel.port1.close();
          channel.port2.close();
        }
      })();
      const expectedTransport =
        mode === "auto" ? (nativeSupported ? "native" : "fallback") : mode;
      if (mode === "fallback") {
        const postMessage = MessagePort.prototype.postMessage;
        MessagePort.prototype.postMessage = function (value, transfer) {
          if (value instanceof ReadableStream)
            throw new DOMException(
              "Forced unsupported transfer",
              "DataCloneError",
            );
          return postMessage.call(this, value, transfer);
        };
      }
    </script>
    <script src="/dist/post-message-manager.js"></script>
  </head>
  <body>
    <pre id="result">running</pre>
    <script>
      const childOrigin = "http://127.0.0.1:4174";
      const manager = new PostMessageManager.default(500);
      const cancellations = {};
      const uncaught = [];
      window.addEventListener("error", (event) => uncaught.push(event.message));
      window.addEventListener("unhandledrejection", (event) =>
        uncaught.push(String(event.reason)),
      );
      const register = (name, callback) =>
        manager.registerStream({
          messageType: `browser:${name}`,
          origin: childOrigin,
          callback,
        });
      register(
        "normal",
        () =>
          new ReadableStream({
            start(controller) {
              controller.enqueue("a");
              controller.enqueue("b");
              controller.close();
            },
          }),
      );
      register("callback-error", () => {
        throw { code: 429, detail: "retry" };
      });
      register(
        "stream-error",
        () =>
          new ReadableStream({
            start(controller) {
              controller.error({ code: 503, detail: "unavailable" });
            },
          }),
      );
      for (const name of [
        "cancel",
        "abort",
        "opening-abort",
        "open-timeout",
        "late-response",
      ]) {
        register(name, async () => {
          if (name.startsWith("open"))
            await new Promise((resolve) => setTimeout(resolve, 80));
          return new ReadableStream({
            start(controller) {
              controller.enqueue("first");
            },
            cancel(reason) {
              cancellations[name] =
                reason instanceof Error
                  ? { name: reason.name, message: reason.message }
                  : reason;
            },
          });
        });
      }
      manager.register({
        messageType: "browser:unregister",
        origin: childOrigin,
        callback: () => "rpc",
      });
      register(
        "unregister",
        () =>
          new ReadableStream({
            start(controller) {
              controller.enqueue("before");
              manager.unregisterStream("browser:unregister");
              setTimeout(() => {
                controller.enqueue("after");
                controller.close();
              }, 30);
            },
          }),
      );
      window.__browserTest = { status: "running", mode };
      window.addEventListener("message", (event) => {
        if (
          event.origin !== childOrigin ||
          event.data?.type !== "browser-test-result"
        )
          return;
        setTimeout(() => {
          const result = {
            ...event.data.result,
            mode,
            nativeSupported,
            expectedTransport,
            userAgent: navigator.userAgent,
            cancellations,
            uncaught: [...uncaught, ...(event.data.result.uncaught ?? [])],
          };
          const equal = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          result.passed =
            equal(result.normal, ["a", "b"]) &&
            equal(result.callbackError, { code: 429, detail: "retry" }) &&
            equal(result.streamError, { code: 503, detail: "unavailable" }) &&
            equal(cancellations.cancel, { action: "stop" }) &&
            equal(cancellations.abort, { action: "abort" }) &&
            equal(result.abortError, { action: "abort" }) &&
            equal(cancellations["opening-abort"], {
              action: "opening-abort",
            }) &&
            equal(result.openingAbortError, { action: "opening-abort" }) &&
            !!result.openTimeoutError &&
            !!cancellations["open-timeout"] &&
            !!result.lateResponseError &&
            !!cancellations["late-response"] &&
            equal(result.unregister, ["before", "after"]) &&
            result.rpc === "rpc" &&
            !!result.unregisteredError &&
            result.uncaught.length === 0 &&
            result.transports?.[expectedTransport] > 0 &&
            result.transports?.[
              expectedTransport === "native" ? "fallback" : "native"
            ] === 0;
          window.__browserTest = result;
          if (window.parent !== window)
            window.parent.postMessage(
              { type: "e2e-case-result", result },
              location.origin,
            );
          document.querySelector("#result").textContent = JSON.stringify(
            result,
            null,
            2,
          );
          fetch("/browser-test/result", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(result),
          });
        }, 150);
      });
      const iframe = document.createElement("iframe");
      iframe.src = `${childOrigin}/browser-test/child.html`;
      document.body.appendChild(iframe);
    </script>
  </body>
</html>
