<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PostMessageManager stream browser test</title>
    <script src="/dist/post-message-manager.js"></script>
  </head>
  <body>
    <pre id="result">running</pre>
    <script>
      const childOrigin = "http://127.0.0.1:4174";
      const manager = new PostMessageManager.default(500);
      let cancelled = false;
      let lateCancelled = false;
      let cloneCancelled = false;
      const uncaught = [];
      window.addEventListener("error", (event) => uncaught.push(event.message));
      window.addEventListener("unhandledrejection", (event) => {
        uncaught.push(String(event.reason));
      });

      function supportsNativeTransfer() {
        const channel = new MessageChannel();
        const stream = new ReadableStream();
        try {
          channel.port1.postMessage(stream, [stream]);
          return true;
        } catch {
          return false;
        } finally {
          channel.port1.close();
          channel.port2.close();
        }
      }

      manager.registerStream({
        messageType: "browser:normal",
        origin: childOrigin,
        callback: () =>
          new ReadableStream({
            start(controller) {
              controller.enqueue("a");
              controller.enqueue("b");
              controller.close();
            },
          }),
      });

      manager.registerStream({
        messageType: "browser:error",
        origin: childOrigin,
        callback: () =>
          new ReadableStream({
            start(controller) {
              const error = new Error("browser failure");
              error.name = "BrowserStreamError";
              controller.error(error);
            },
          }),
      });

      manager.registerStream({
        messageType: "browser:cancel",
        origin: childOrigin,
        callback: () =>
          new ReadableStream({
            start(controller) {
              controller.enqueue("first");
            },
            cancel() {
              cancelled = true;
            },
          }),
      });

      window.__browserTest = { status: "running" };
      manager.registerStream({
        messageType: "browser:late",
        origin: childOrigin,
        callback: async () => {
          await new Promise((resolve) => setTimeout(resolve, 80));
          return new ReadableStream({
            cancel() { lateCancelled = true; },
          });
        },
      });
      manager.registerStream({
        messageType: "browser:clone-error",
        origin: childOrigin,
        callback: () => new ReadableStream({
          start(controller) { controller.enqueue(() => undefined); },
          cancel() { cloneCancelled = true; },
        }),
      });
      manager.registerStream({
        messageType: "browser:queued-close",
        origin: childOrigin,
        callback: () => new ReadableStream({
          start(controller) {
            controller.enqueue("first");
            controller.enqueue("queued");
            controller.close();
          },
        }),
      });
      window.addEventListener("message", (event) => {
        if (
          event.origin !== childOrigin ||
          event.data?.type !== "browser-test-result"
        ) {
          return;
        }
        setTimeout(() => {
          const result = {
            ...event.data.result,
            userAgent: navigator.userAgent,
            cancelled,
            lateCancelled,
            cloneCancelled,
            uncaught: [...uncaught, ...(event.data.result.uncaught ?? [])],
            nativeTransferSupported: supportsNativeTransfer(),
          };
          result.passed =
            JSON.stringify(result.normal) === JSON.stringify(["a", "b"]) &&
            result.error?.name === "BrowserStreamError" &&
            result.error?.message === "browser failure" &&
            result.cancelled === true &&
            result.lateCancelled === true &&
            result.cloneCancelled === true &&
            result.openingTimeout === true &&
            result.cloneError?.name === "DataCloneError" &&
            result.queuedCloseRuns === 10 &&
            result.uncaught.length === 0;
          window.__browserTest = result;
          document.querySelector("#result").textContent = JSON.stringify(
            result,
            null,
            2
          );
          fetch("/browser-test/result", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(result),
          });
        }, 150);
      });

      const iframe = document.createElement("iframe");
      iframe.src = `${childOrigin}/browser-test/child.html`;
      document.body.appendChild(iframe);
    </script>
  </body>
</html>
